server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 反代到 app 容器（compose 服务名解析）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;    # 报告生成含 LLM 调用，放宽读超时
    }

    # SPA 路由兜底：前端路由全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（哈希文件名可长缓存）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
